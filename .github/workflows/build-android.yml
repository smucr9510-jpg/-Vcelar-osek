
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
    
      - name: Unpack visual project
        run: |
          mkdir -p /tmp/vcelar
          unzip -o Vcelar_Osek_verze_4.zip -d /tmp/vcelar
          cp -r /tmp/vcelar/. .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm install
          npm install --save-dev typescript@5.9.3

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html app.js map.js sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png www/

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vcelar-osek-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
