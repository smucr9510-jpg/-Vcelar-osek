
name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack corrected project
        run: |
          mkdir -p /tmp/vcelar
          unzip -o Vcelar_Osek_OPRAVA_ZALOHY.zip -d /tmp/vcelar
          cp -r /tmp/vcelar/. .

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web files and bundle JavaScript
        run: |
          mkdir -p www
          cp index.html map.js sw.js manifest.webmanifest icon.svg honeycomb-bg.svg apiary-background.jpg icon-192.png icon-512.png www/
          npx esbuild app.js --bundle --outfile=www/app.bundle.js --format=iife

      - name: Add Android platform
        run: npx cap add android

      - name: Apply supplied bee launcher icons
        run: |
          cp -r android-launcher-icons/mipmap-* android/app/src/main/res/
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: vcelar-osek-android-fixed
          path: android/app/build/outputs/apk/debug/app-debug.apk
