
name: Update NDVI around Osek

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * 1"

permissions:
  contents: write

jobs:
  update-ndvi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get CDSE access token
        env:
          CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
        run: |
          set -e
          RESPONSE=$(mktemp)
          HTTP_CODE=$(curl -sS -o "$RESPONSE" -w "%{http_code}" \
            -X POST \
            "https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "CDSE token request failed: HTTP $HTTP_CODE"
            cat "$RESPONSE"
            exit 1
          fi
          TOKEN=$(jq -er '.access_token' "$RESPONSE")
          echo "::add-mask::$TOKEN"
          echo "CDSE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Calculate Sentinel-2 NDVI for 1, 2, 3 and 5 km
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json, math, os, urllib.request, urllib.error
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          token = os.environ["CDSE_TOKEN"]
          cx, cy = 399201.25, 5515161.50
          now = datetime.now(timezone.utc)
          start = now - timedelta(days=60)

          evalscript = """//VERSION=3
          function setup() {
            return {
              input: [{bands: ["B04", "B08", "SCL", "dataMask"]}],
              output: [
                {id: "ndvi", bands: 1, sampleType: "FLOAT32"},
                {id: "dataMask", bands: 1}
              ]
            };
          }
          function evaluatePixel(s) {
            let sum = s.B08 + s.B04;
            let ndvi = sum === 0 ? 0 : (s.B08 - s.B04) / sum;
            let mask = s.dataMask;
            if ([3, 6, 8, 9, 10, 11].includes(s.SCL) || sum === 0) mask = 0;
            return {ndvi: [ndvi], dataMask: [mask]};
          }
          """

          rings = {}
          for radius_km in [1, 2, 3, 5]:
            radius = radius_km * 1000
            ring = [
              [cx + radius * math.cos(2 * math.pi * i / 48),
               cy + radius * math.sin(2 * math.pi * i / 48)]
              for i in range(48)
            ]
            ring.append(ring[0])

            request_data = {
              "input": {
                "bounds": {
                  "geometry": {"type": "Polygon", "coordinates": [ring]},
                  "properties": {
                    "crs": "http://www.opengis.net/def/crs/EPSG/0/32633"
                  }
                },
                "data": [{
                  "type": "sentinel-2-l2a",
                  "dataFilter": {
                    "mosaickingOrder": "leastCC",
                    "maxCloudCoverage": 80
                  }
                }]
              },
              "aggregation": {
                "timeRange": {
                  "from": start.strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "to": now.strftime("%Y-%m-%dT%H:%M:%SZ")
                },
                "aggregationInterval": {"of": "P10D"},
                "evalscript": evalscript,
                "resx": 100,
                "resy": 100
              }
            }

            body = json.dumps(request_data).encode("utf-8")
            req = urllib.request.Request(
              "https://sh.dataspace.copernicus.eu/statistics/v1",
              data=body,
              headers={
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json",
                "Accept": "application/json"
              },
              method="POST"
            )

            try:
              with urllib.request.urlopen(req, timeout=180) as response:
                result = json.loads(response.read().decode("utf-8"))
            except urllib.error.HTTPError as e:
              detail = e.read().decode("utf-8", errors="replace")
              raise SystemExit(
                f"Sentinel Hub error for {radius_km} km: HTTP {e.code}: {detail}"
              )

            if result.get("status") != "OK" or not result.get("data"):
              raise SystemExit(f"Sentinel Hub nevrátil data pro okruh {radius_km} km")

            rings[str(radius_km)] = result["data"]
            print(f"Okruh {radius_km} km: {len(result['data'])} intervalů")

          output = {
            "status": "OK",
            "data": rings["5"],
            "rings": rings,
            "updated": now.isoformat(),
            "site": "TORENO, Osek",
            "radius_m": 5000,
            "radii_km": [1, 2, 3, 5]
          }

          Path("data/ndvi-latest.json").write_text(
            json.dumps(output, ensure_ascii=False, indent=2),
            encoding="utf-8"
          )
          print("Uložena data NDVI pro všechny čtyři okruhy.")
          PY

      - name: Commit NDVI data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ndvi-latest.json
          git diff --cached --quiet || git commit -m "Update NDVI rings around Osek"
          git push
