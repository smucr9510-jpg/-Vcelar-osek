name: Deploy Vcelar Osek to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare web app
        run: |
          mkdir -p source public
          unzip -o Vcelar_Osek_STANOVISTE_OPRAVA.zip -d source
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/app.js")
          s = p.read_text()

          # iOS-friendly backup export
          start = s.index("$('export').onclick=async()=>")
          end = s.index("$('importFile').onchange", start)
          replacement = """$('export').onclick=async()=>{
            const json=JSON.stringify({app:'Včelař – Osek',version:2,exported:new Date().toISOString(),site:SITE,data:db},null,2);
            const name='vcelar-osek-zaloha-'+today()+'.json';
            try{
              const file=new File([json],name,{type:'application/json'});
              if(navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
                await navigator.share({files:[file],title:'Záloha Včelař – Osek'});
                $('backupStatus').textContent='Vyberte Uložit do Souborů.';
              }else{
                const blob=new Blob([json],{type:'application/json'});
                const url=URL.createObjectURL(blob);
                const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
                setTimeout(()=>URL.revokeObjectURL(url),60000);
                $('backupStatus').textContent='Záloha se stahuje: '+name;
              }
            }catch(e){
              if(e.name==='AbortError') $('backupStatus').textContent='Sdílení zrušeno.';
              else $('backupStatus').textContent='Export se nepodařil: '+e.message;
            }
          };
          """
          s = s[:start] + replacement + s[end:]

          # LPIS: Safari-compatible paginated import. Preserve local records and
          # manually completed fields; merge old and new LPIS identifiers.
          start = s.index("$('getFeatures').onclick=async()=>")
          end = s.index("$('export').onclick=async()=>", start)
          replacement = r"""$('getFeatures').onclick=async()=>{
            const selectedLayer=$('wfsLayer').value;
            if(!selectedLayer){wfsStatus('Nejdříve načtěte a vyberte vrstvu.',true);return}
            if(!navigator.onLine){wfsStatus('Jste offline. LPIS import vyžaduje internet.',true);return}
            const button=$('getFeatures');
            button.disabled=true;
            let stage='příprava požadavku WFS 2.0.0';
            try{
              const lat=SITE.lat,lon=SITE.lon;
              const dy=5000/111320,dx=5000/(111320*Math.cos(lat*Math.PI/180));
              const endpointUrl=new URL(endpoint());
              endpointUrl.search='';
              const layer=selectedLayer.includes(':')?selectedLayer:'ms:'+selectedLayer;
              const pageSize=Math.max(100,Math.min(1000,Number($('wfsLimit').value)||300));
              let received=0,added=0,updated=0,startIndex=0,total=null;
              const seen=new Set();
              for(let page=0;page<100;page++){
                stage='sestavení parametrů WFS 2.0.0';
                endpointUrl.search='';
                const params={
                  service:'WFS',version:'2.0.0',request:'GetFeature',
                  typeNames:layer,outputFormat:'application/json; subtype=geojson',
                  srsName:'EPSG:4326',
                  // WFS 2.0 honours the EPSG:4326 axis order: latitude, longitude.
                  bbox:[lat-dy,lon-dx,lat+dy,lon+dx,'EPSG:4326'].join(','),
                  count:String(pageSize),startIndex:String(startIndex)
                };
                for(const key of Object.keys(params)){
                  endpointUrl.searchParams.set(key,String(params[key]));
                }
                wfsStatus('Načítám LPIS 2.0: dávka '+(page+1)+' · dosud '+received+' prvků…');
                stage='odeslání požadavku LPIS';
                const response=await fetch(endpointUrl.href,{cache:'no-store'});
                if(!response.ok){
                  const errorBody=(await response.text()).slice(0,700);
                  throw Error('HTTP '+response.status+(errorBody?' – '+errorBody:''));
                }
                stage='čtení GeoJSON odpovědi LPIS';
                const payload=await response.json();
                if(payload.type==='ExceptionReport'||payload.exceptions){
                  throw Error('LPIS vrátil chybu: '+JSON.stringify(payload).slice(0,500));
                }
                const features=Array.isArray(payload.features)?payload.features:[];
                if(total===null){
                  const rawTotal=payload.numberMatched??payload.totalFeatures;
                  const parsedTotal=Number(rawTotal);
                  if(rawTotal!==undefined&&Number.isFinite(parsedTotal)&&parsedTotal>=0)total=parsedTotal;
                }
                if(!features.length)break;
                received+=features.length;
                stage='zpracování hranic pozemků';
                for(const feature of features){
                  const attrs=feature.properties||{};
                  const rawId=attrs.IdDiluPudnihoBloku??attrs.idDiluPudnihoBloku??
                    attrs.ID_DPB??attrs.idDpb??attrs.zkracenyKod??attrs.ZKRACENYKOD??
                    attrs.KOD_DPB??attrs.kodDpb??attrs.id??attrs.ID??feature.id??'';
                  const parcelId=rawId==null?'':String(rawId).trim();
                  const geometryKey=feature.geometry?JSON.stringify(feature.geometry):'';
                  const stableKey=parcelId?'lpis:'+parcelId:(geometryKey?'geom:'+geometryKey:'');
                  if(!stableKey||seen.has(stableKey))continue;
                  seen.add(stableKey);
                  const areaRaw=attrs.vymera??attrs.VYMERA??attrs.Vymera??'';
                  let area=Number(areaRaw);
                  if(Number.isFinite(area)&&area>10000)area=area/10000;
                  const importedArea=Number.isFinite(area)&&area>0?String(area):'';
                  const importedCulture=String(attrs.kultura??attrs.KULTURA??attrs.Kultura??'');
                  const existing=db.parcels.find(parcel=>
                    parcel.sourceKey===stableKey||parcel.sourceKey===parcelId||
                    parcel.sourceKey==='lpis:'+parcelId||
                    (parcelId&&String(parcel.code||'').trim()===parcelId)||
                    (parcelId&&String(parcel.attributes?.IdDiluPudnihoBloku??
                      parcel.attributes?.idDiluPudnihoBloku??parcel.attributes?.idDpb??
                      parcel.attributes?.ID_DPB??'').trim()===parcelId)
                  );
                  if(existing){
                    existing.sourceKey=stableKey;
                    existing.geometry=feature.geometry||existing.geometry;
                    existing.attributes=attrs;
                    if(!existing.area)existing.area=importedArea;
                    if(!existing.culture)existing.culture=importedCulture;
                    if(!existing.status)existing.status='LPIS – hranice';
                    updated++;
                  }else{
                    db.parcels.push({
                      id:uid(),code:parcelId||'LPIS '+stableKey.slice(-12),
                      dist:'',area:importedArea,culture:importedCulture,crop:'',
                      status:'LPIS – hranice',from:'',to:'',bee:'Neurčeno',verified:'',
                      notes:'Import z veřejné LPIS WFS. Plodina a kvetení nejsou potvrzeny.',
                      geometry:feature.geometry,sourceKey:stableKey,attributes:attrs
                    });
                    added++;
                  }
                }
                startIndex+=features.length;
                if(features.length<pageSize)break;
                if(total!==null&&startIndex>=total)break;
              }
              if(received===0)throw Error('LPIS nevrátilo žádné prvky pro oblast stanoviště. Zkontrolujte vrstvu a oblast.');
              stage='ukládání evidence';
              save();
              wfsStatus('LPIS 2.0 načteno: '+received+' prvků. Nové: '+added+
                ', aktualizované: '+updated+', celkem v evidenci: '+db.parcels.length+
                '. Ručně doplněné údaje zůstaly zachovány.');
            }catch(error){
              wfsStatus('Chyba při '+stage+': '+(error?.message||String(error))+
                '. Dosavadní evidence zůstává v telefonu zachována.',true);
            }finally{
              button.disabled=false;
            }
          };
          """
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
          cd source
          npm install
          npx esbuild app.js --bundle --outfile=../public/app.bundle.js --platform=browser --format=iife --loader:.geojson=json
          cd ..
          cp -a source/. public/

          cp forecast.js public/forecast.js
          mkdir -p public/data
          cp data/ndvi-latest.json public/data/ndvi-latest.json
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("public/index.html")
          s = p.read_text()
          old = '<script src="map.js"></script>'
          new = old + '<script src="forecast.js"></script>'
          if old not in s:
              raise SystemExit("Nenalezeno místo pro vložení forecast.js")
          p.write_text(s.replace(old, new, 1))

          # Update the service worker itself (not index.html).
          p = Path("public/sw.js")
          s = p.read_text()
          s, count = re.subn(
              r"const\s+CACHE\s*=\s*['\"][^'\"]+['\"]\s*;",
              "const CACHE='vcelar-osek-v${{ github.run_number }}-forecast';",
              s,
              count=1
          )
          if count != 1:
              raise SystemExit("V souboru public/sw.js nebyl nalezen řádek CACHE.")
          old = "'./icon-512.png']"
          new = "'./icon-512.png','./forecast.js','./data/ndvi-latest.json','./crops/plodiny_lpis_2026_osek_5km.geojson']"
          if old not in s:
              raise SystemExit("Nenalezen seznam souborů offline cache")
          s = s.replace(old, new, 1)
          fetch_handler = "self.addEventListener('fetch',event=>{if(event.request.method!=='GET')return;const url=new URL(event.request.url);if(url.origin!==self.location.origin)return;event.respondWith(fetch(event.request).then(response=>{if(response&&response.ok){const copy=response.clone();caches.open(CACHE).then(cache=>cache.put(event.request,copy))}return response}).catch(()=>caches.match(event.request).then(cached=>cached||new Response('Offline – obsah není uložen v mezipaměti.',{status:503,headers:{'Content-Type':'text/plain; charset=utf-8'}}))))});"
          lines = s.splitlines()
          for i, line in enumerate(lines):
              if "self.addEventListener('fetch'" in line:
                  lines[i] = fetch_handler
                  break
          else:
              raise SystemExit("Ve service workeru nebyl nalezen fetch handler.")
          p.write_text("\n".join(lines) + "\n")
          PY

          touch public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
